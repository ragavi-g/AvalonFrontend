<ng-container [ngSwitch]="icon()">
    <ng-container *ngSwitchCase="'sov-imported-items'">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" fill="#CDE0F8" />
            <path d="M25 18H35L43 26V46C43 47.1 42.1 48 41 48H25C23.9 48 23 47.1 23 46V20C23 18.9 23.9 18 25 18Z"
                stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" />
            <path d="M35 18V26H43" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" />
            <path d="M28 33H38" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
            <path d="M28 38H38" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
        </svg>
    </ng-container>
    <ng-container *ngSwitchCase="'up-arrow'">
        <svg class="change-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path d="M8 3L12 7H9V13H7V7H4L8 3Z" fill="#16A34A" />
        </svg>
    </ng-container>
    <ng-container *ngSwitchCase="'down-arrow'">
        <svg class="change-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path d="M8 13L4 9H7V3H9V9H12L8 13Z" fill="#DC2626" />
        </svg>
    </ng-container>
    <ng-container *ngSwitchCase="'approval-list'">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" fill="#D9F4E7" />
            <circle cx="32" cy="32" r="14" stroke="#16A34A" stroke-width="2.5" />
            <path d="M26 32L30 36L38 28" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
    </ng-container>
    <ng-container *ngSwitchCase="'submission-list'">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" fill="#FFE6C8" />
            <circle cx="32" cy="32" r="14" stroke="#F59E0B" stroke-width="2.5" />
            <path d="M32 24V32L37 35" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
    </ng-container>
    <ng-container *ngSwitchCase="'bound-policies'">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" fill="#EEDEFE" />
            <path d="M25 18H35L43 26V46C43 47.1 42.1 48 41 48H25C23.9 48 23 47.1 23 46V20C23 18.9 23.9 18 25 18Z"
                stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" />
            <path d="M35 18V26H43" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" />
            <path d="M28 33H38" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" />
            <path d="M28 38H38" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" />
        </svg>
    </ng-container>
    <ng-container *ngSwitchCase="'approved-activity'">
        <svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" fill="#E8F7EE" />
            <circle cx="32" cy="32" r="14" stroke="#16A34A" stroke-width="2.5" />
            <path d="M26 32L30 36L38 28" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
    </ng-container>
    <ng-container *ngSwitchCase="'sent'">
        <svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" fill="#F3E8FF" />
            <path d="M25 18H35L43 26V46C43 47.1 42.1 48 41 48H25C23.9 48 23 47.1 23 46V20C23 18.9 23.9 18 25 18Z"
                stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" />

            <path d="M28 33H38" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" />
            <path d="M28 38H38" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" />
        </svg>
    </ng-container>

    <ng-container *ngSwitchCase="'menu-icon'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="5" r="2" fill="#6B7280" />
            <circle cx="12" cy="12" r="2" fill="#6B7280" />
            <circle cx="12" cy="19" r="2" fill="#6B7280" />
        </svg>
    </ng-container>
    <ng-container *ngSwitchCase="'in-review'">
        <svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" fill="#EAF2FF" />
            <circle cx="32" cy="32" r="14" stroke="#2563EB" stroke-width="2.5" />
            <path d="M32 24V32L37 35" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
    </ng-container>
    <ng-container *ngSwitchCase="'received'">
        <svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" fill="#FFF4E5" />
            <path d="M25 18H35L43 26V46C43 47.1 42.1 48 41 48H25C23.9 48 23 47.1 23 46V20C23 18.9 23.9 18 25 18Z"

            <path d="M28 33H38" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
            <path d="M28 38H38" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
        </svg>
    </ng-container>
    <ng-container *ngSwitchCase="'new-submission'">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="18" width="24" height="24" rx="3" stroke="#2563EB" stroke-width="2.5" />
            <path d="M32 24V36" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
            <path d="M26 30H38" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />

    </ng-container>
    <ng-container *ngSwitchCase="'upload-sov'">

            <path d="M16 28c-3 0-5-2-5-5s2-5 5-5c0-4 3-7 8-7s8 3 8 7c3 0 5 2 5 5s-2 5-5 5" stroke="#10B981"

                stroke-linejoin="round" />

                stroke-linecap="round" />
        </svg>
    </ng-container>

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            <path d="M8 18H9" stroke="#E7000B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <ng-container *ngSwitchCase="'reports-analytics'">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="32" width="6" height="12" rx="2" stroke="#10B981" stroke-width="2.5" />
            <rect x="30" y="22" width="6" height="22" rx="2" stroke="#10B981" stroke-width="2.5" />
            <rect x="40" y="27" width="6" height="17" rx="2" stroke="#10B981" stroke-width="2.5" />
