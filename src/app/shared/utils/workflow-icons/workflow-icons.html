                    <stop offset="50%" stop-color="rgba(217, 119, 6, 0.55)" />
                    <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
                </linearGradient>
                <clipPath id="workflow-shimmer-clip">
                    <polygon points="0,0 92,0 100,24 92,48 0,48 8,24" />
                </clipPath>
            </defs>
            <rect width="100%" height="100%" clip-path="url(#workflow-shimmer-clip)"
                fill="url(#workflow-shimmer-gradient)">
                <animate attributeName="x" values="-100;100" dur="1.5s" repeatCount="indefinite" />
            </rect>
        </svg>
    </ng-container>
