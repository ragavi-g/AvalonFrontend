<footer class="app-footer">
  <div class="footer-content">
    <div class="footer-left">
      <p>&copy; {{ currentYear }} {{ applicationName }}. All rights reserved.</p>
    </div>
    <div class="footer-right">
      <nav class="footer-nav">
        <ng-container *ngFor="let link of footerLinks; let isLast = last">
          <a [href]="link.url" class="footer-link">
            {{ link.text }}
          </a>
          <span class="footer-separator" *ngIf="!isLast">|</span>
        </ng-container>
      </nav>
    </div>
  </div>
</footer>
